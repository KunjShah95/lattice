name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel superseded runs on the same ref — nobody wants to read a log from a
# commit that has already been superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the default single-commit fetch. The corrections
          # log is generated from `git log` (scripts/build-corrections-log.mjs),
          # so a shallow clone would compute a different log and `generate:check`
          # could fail — or worse, commit a different log's worth of a page.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Branding must be configured for a deployable build. These four values
      # are what every canonical URL, every og:url and every generated share
      # image resolves against, so shipping them as placeholders publishes 143
      # pages pointing at a domain nobody owns — and makes every social share of
      # a tool link render from a URL that 404s.
      #
      # Gated on the SITE_URL repo variable so the gate is skipped until someone
      # sets it, rather than blocking every commit with a placeholder warning.
      - name: Branding
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
          NEXT_PUBLIC_CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          NEXT_PUBLIC_CONTACT_X: ${{ vars.CONTACT_X }}
          NEXT_PUBLIC_COPYRIGHT_HOLDER: ${{ vars.COPYRIGHT_HOLDER }}
        run: |
          if [ -z "$NEXT_PUBLIC_SITE_URL" ]; then
            echo "::notice::SITE_URL repo variable is unset - skipping the branding gate."
            echo "Set it (and the other three) before the first public deploy."
            exit 0
          fi
          npx vitest run src/lib/brand.test.ts

      - name: Lint
        run: npm run lint

      # brand.test.ts is the Branding gate above, which is skipped while the
      # SITE_URL repo variable is unset. Running it again here, without that
      # env, failed every push on placeholder values the deploy never uses
      # (Cloudflare's build has its own). So it runs in exactly one place.
      - name: Test
        run: npm run test -- --exclude src/lib/brand.test.ts

      # The submission pipeline runs under bare node with no build step and pushes
      # branches, so vitest cannot reach it. This harness runs it against a
      # stubbed GitHub inside a throwaway repository, which is the only place its
      # behaviour is testable without a token — and the only place it is safe to
      # run at all.
      - name: Submission pipeline
        run: npm run test:submissions

      # The generated artefacts. `generate:check` asserts `public/awesome-lattice.md`
      # is in step with the dataset and that `src/content/essay-text.generated.ts`
      # is in step with the MDX essays.
      #
      # The essay one is the load-bearing half. Those bodies are served as MCP
      # `resources/read`, so a reworded essay would keep shipping a copy of the old
      # prose to every agent that reads it — while the page, the search index and
      # the sitemap all show the new one. Nothing else would notice: the resource
      # is text, so it cannot fail to build.
      - name: Generated content is in step with its source
        run: npm run generate:check

      # The Worker bundle, built and booted, because `next start` is Node and
      # cannot see a Worker-only failure. `/mcp` returned 500 in production while
      # every route passed every check above: it was the only route declaring
      # `runtime = "edge"`, which loads fine on Node and fails on the Worker.
      #
      # Verified against the actual regression — reintroducing that one line
      # fails six checks here, all of them `Internal Server Error`. So this is
      # not a smoke test in the decorative sense; it is the check that would have
      # stopped the incident.
      #
      # `npm run build`, not `npx opennextjs-cloudflare build`: the latter
      # re-enters itself without the recursion marker `scripts/build.mjs` sets,
      # and produces a `next-env.mjs` with duplicate exports that the Worker
      # refuses to load.
      # `scripts/build.mjs` refuses to bundle without an https SITE_URL, which
      # is right for a deploy and wrong for CI: this bundle is booted and
      # smoke-tested, never shipped. The repo variable wins when set; the
      # fallback is the live origin so the gate's domain checks still pass.
      - name: Build the Worker bundle
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://lattice.kkshah2005.workers.dev' }}
        run: |
          rm -rf .open-next
          npm run build

      - name: Smoke-test the Worker
        run: npm run test:worker

      # Plain `next build`, deliberately not the OpenNext bundle. This step
      # exists to type-check and prerender; bundling the Worker is the deploy
      # pipeline's job, and doing it here doubles the slowest step in CI.
      - name: Build
        run: npm run next:build

      # Client bundle budget, measured from the build this step just produced.
      #
      # Commit a446032 cut main-thread work by hand across the palette and the
      # explorer, and nothing noticed when it came back — `next build` prints
      # route sizes and asserts on none of them. The clearest version of the same
      # failure is the search corpus that used to be inlined into every route's
      # payload: ~42 KB of JSON on a page whose own markup was 16 KB, found by
      # reading the code rather than by a build failing.
      - name: Client bundle budget
        run: npm run budget

      # `next build` passing is not sufficient for this route shape. A dynamic
      # segment named inconsistently builds cleanly and then 500s at runtime,
      # so the server is actually started and a sample of routes is requested.
      #
      # This runs on Node, so it is the *fast* check and the Worker smoke test
      # above is the authoritative one. Both earn their place: this one catches a
      # route that never builds or a handler that throws cold, in about fifteen
      # seconds, and the other catches the runtime-specific class that this
      # structurally cannot see.
      # Browser tests: accessibility and interaction.
      #
      # `next start` above this build is torn down before these run, because a
      # `next dev` and `next build` cannot share a `.next` — and `playwright.config.ts`
      # reuses an existing server when one is listening, which would silently
      # test the wrong build.
      - name: Browser tests
        run: |
          npm run a11y:install
          npx playwright test
        env:
          CI: "1"

      - name: Smoke-test the built server
        run: |
          npx next start -p 3111 &
          for i in $(seq 1 40); do
            curl -sf "http://localhost:3111/" >/dev/null && break
            sleep 1
          done
          fail=0
          for path in / /all /blog /compare /glossary /submit /bands \
                      /glossary/kv-cache /inference-serving \
                      /inference-serving/vllm /blog/evals-are-the-asset \
                      /compare/vector-databases /bands/compute /bands/state \
                      /feed.xml /llms.txt /llms-full.txt \
                      /sitemap.xml /mcp.json; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3111$path")
            echo "$code $path"
            [ "$code" = "200" ] || fail=1
          done
          # A GET on the MCP endpoint is a 405 by design — it exists, but the
          # protocol uses POST. Asserted rather than skipped, because a 404 would
          # look identical to "the route was never built".
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3111/mcp")
          echo "$code /mcp (expect 405)"
          [ "$code" = "405" ] || fail=1
          # And the route must answer JSON-RPC, not merely exist.
          rpc=$(curl -s -X POST -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{}}}' \
            "http://localhost:3111/mcp")
          echo "$rpc" | head -c 160; echo
          echo "$rpc" | grep -q '"protocolVersion"' || fail=1
          # An unknown dynamic-segment value must 404 rather than render. This is
          # the check the band and role routes share: both are prerendered from a
          # vocabulary, and a value outside it builds cleanly either way.
          for path in /bands/nonsense /roles/nonsense; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3111$path")
            echo "$code $path (expect 404)"
            [ "$code" = "404" ] || fail=1
          done
          # The facet surface. Asserted on the *filters* taking effect, not on
          # the status, because a route that ignored them and returned the whole
          # corpus would answer 200 and be useless to every agent without an MCP
          # client.
          facets=$(curl -s "http://localhost:3111/api/search?kind=platform&deployment=saas&limit=50")
          echo "$facets" | head -c 120; echo
          echo "$facets" | grep -q '"deployment":\["saas"\]' || fail=1
          echo "$facets" | grep -q '"count":[1-9]' || fail=1
          # An unknown path must 404, not 200 or 500.
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3111/definitely-not-a-page")
          echo "$code /definitely-not-a-page"
          [ "$code" = "404" ] || fail=1

          # Share-card bounds, against the same server.
          #
          # This is the only check in the repo that catches a clipped or
          # overflowing Open Graph card. Satori throws on neither: it renders a
          # card with the sentence cut off past the padding, and the page that
          # references it is a perfectly valid PNG that nobody looks at twice.
          #
          # It runs here rather than in its own step because it needs a
          # *production* server — in dev every card pays a Turbopack compile first
          # and a stale dev bundle hands back a card the production build would
          # not — and starting a second one would double the boot wait.
          # Share-card bounds, against the same server. `node` form, not
          # `npm run og:render -- --base`: npm parses `--base` as its own flag
          # and errors out before the script runs.
          node scripts/render-og.mjs --base http://localhost:3111
          python scripts/check-og-bounds.py og-out || fail=1
          exit $fail
